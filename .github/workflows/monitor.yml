name: Collect business reviews
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: insightpilot-review-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect due review sources
        env:
          INSIGHTPILOT_SCHEDULER_KEY: ${{ secrets.INSIGHTPILOT_SCHEDULER_KEY }}
          INSIGHTPILOT_URL: https://insightpilot-research.brightdrum2050.chatgpt.site
        run: node scripts/collect-reviews.mjs
